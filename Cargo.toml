[package]
name = "cctop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "btop-style live dashboard for Claude Code internals, in a pane beside your session"
license = "MIT"
repository = "https://github.com/tomstagl/cctop"
readme = "README.md"
keywords = ["claude", "tui", "dashboard", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
notify = "7"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
toml = "0.8"

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
