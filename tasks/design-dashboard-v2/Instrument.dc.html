<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans Condensed", system-ui, sans-serif; background: #0A0E12; }
    a { color: #4CC2C2; } a:hover { color: #7ADCDC; }
    .m { font-family: "IBM Plex Mono", monospace; }
    .r { white-space: pre; font-variant-ligatures: none; }
  </style>
</helmet>
<div style="box-sizing: border-box; padding: 28px 30px 34px; display: flex; flex-direction: column; gap: 18px; background: #0A0E12">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
      <span class="m" style="font-size: 13px; font-weight: 600; color: {{tone}}">{{num}}</span>
      <span style="font-size: 22px; font-weight: 600; color: #D6DEE8">{{name}}</span>
      <span class="m" style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: {{tone}}">{{axis}}</span>
    </div>
    <div style="font-size: 14.5px; line-height: 1.5; color: #8FA0B4; max-width: 900px; text-wrap: pretty">{{lede}}</div>
  </div>

  <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: center">
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="m" style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E7F93">width</span>
      <div style="display: flex; gap: 6px"><sc-for list="{{widthBtns}}" as="b" hint-placeholder-count="2"><button onClick="{{ b.pick }}" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 5px; cursor: pointer; border: 1px solid {{b.bd}}; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button></sc-for></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="m" style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E7F93">state</span>
      <span class="m" style="font-size: 12px; padding: 6px 12px; border-radius: 5px; background: #121820; color: #A6B4C4">{{stateLabel}}</span>
      <button onClick="{{ reset }}" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 5px; cursor: pointer; border: 1px solid #2E3B49; background: transparent; color: #8FA0B4">reset</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="border-radius: 7px; border: 1px solid #1A222B; padding: 13px 15px; background: #0E1318; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 18px; width: max-content"><sc-for list="{{rows}}" as="row" hint-placeholder-count="22"><div class="r"><sc-for list="{{row}}" as="g" hint-placeholder-count="14"><span onClick="{{ g.on }}" style="color: {{g.c}}; font-weight: {{g.w}}; cursor: {{g.cur}}; text-decoration: {{g.ul}}; text-underline-offset: 3px">{{g.t}}</span></sc-for></div></sc-for></div>
    <div class="m" style="font-size: 11px; color: #5D6B7D">{{hint}}</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 6px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 6px; background: #121820; border-left: 3px solid #5FC77E"><div class="m" style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #5FC77E">what it fixes</div><div style="font-size: 13.5px; line-height: 1.5; color: #A6B4C4; text-wrap: pretty">{{fixes}}</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 6px; background: #121820; border-left: 3px solid #E5605E"><div class="m" style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #E5605E">what it costs</div><div style="font-size: 13.5px; line-height: 1.5; color: #A6B4C4; text-wrap: pretty">{{costs}}</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 6px; background: #121820; border-left: 3px solid #4CC2C2"><div class="m" style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #4CC2C2">pick this if</div><div style="font-size: 13.5px; line-height: 1.5; color: #A6B4C4; text-wrap: pretty">{{pick}}</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1160,"height":1080}}'>
var P = { bg:'#0E1318', fg:'#D6DEE8', dim:'#5D6B7D', accent:'#4CC2C2', ok:'#5FC77E', warn:'#E2B04A', crit:'#E5605E', border:'#2A3644',
          s0:'#516A69', s1:'#69AAAA', s2:'#7EF0F0' };
function sg(t, r, b, on) { return { t: String(t), r: r || 'fg', b: !!b, on: on }; }
function lw(l) { var n = 0; for (var i = 0; i < l.length; i++) n += Array.from(l[i].t).length; return n; }
function at(l, c, r) { var n = c - lw(l); if (n > 0) l.push(sg(' '.repeat(n), r || 'dim')); return l; }
function rt(l, c, txt, role, b) { at(l, c - Array.from(String(txt)).length); l.push(sg(txt, role, b)); return l; }
function sp(l, right, cols) { var n = cols - lw(l) - lw(right); l.push(sg(' '.repeat(n > 0 ? n : 1), 'dim')); for (var i = 0; i < right.length; i++) l.push(right[i]); return l; }
function fit(l, cols) { var o = [], u = 0; for (var i = 0; i < l.length; i++) { if (u >= cols) break; var a = Array.from(l[i].t);
  if (u + a.length <= cols) { o.push(l[i]); u += a.length; } else { o.push({ t: a.slice(0, Math.max(0, cols - u - 1)).join('') + '…', r: l[i].r, b: l[i].b }); u = cols; } } return o; }
function rule(cols, role) { return [sg('─'.repeat(cols), role || 'border')]; }
function bar(pct, w, role) { var f = Math.max(0, Math.min(w, Math.round(pct / 100 * w))); if (f === 0 && pct > 0) f = 1; if (f === w && pct < 100) f = w - 1;
  return [sg('▇'.repeat(f), role || 'ok'), sg('▁'.repeat(w - f), 'border')]; }
// the context bar, stacked by agency: fixed / transient / yours, alternating glyphs
function ctx(w) { var filled = Math.round(0.35 * w), a = Math.round(filled * 65 / 238), b = Math.round(filled * 42 / 238), c = filled - a - b;
  return [sg('▇'.repeat(a), 's0'), sg('▆'.repeat(b), 's1'), sg('▇'.repeat(c), 's2'), sg('▁'.repeat(w - filled), 'border')]; }
function paint(rows, cols) { return rows.map(function (l) { l = fit(l, cols);
  if (!l.length) return [{ t: ' '.repeat(cols), c: P.dim, w: '400', cur: 'default', ul: 'none' }];
  var out = l.map(function (s) { return { t: s.t, c: P[s.r] || P.fg, w: s.b ? '600' : '400', on: s.on, cur: s.on ? 'pointer' : 'default', ul: s.on ? 'underline dotted' : 'none' }; });
  var n = cols - l.reduce(function (x, s) { return x + Array.from(s.t).length; }, 0);
  if (n > 0) out.push({ t: ' '.repeat(n), c: P.dim, w: '400', cur: 'default', ul: 'none' });
  return out; }); }

// Shared content for every view, used as a framed panel (1, 2) or as the body (3).
function bContext(cols) {

            ['results', 82, 's2', 'what tools returned — the lever you actually control']];
  var rows = [[sg('  350k', 'fg', true), sg(' of ', 'dim'), sg('1.00M', 'fg'), sg('   autocompact ', 'dim'), sg('967k', 'fg'), sg('   ', 'dim'), sg('616k', 'ok', true), sg(' left', 'dim'), sg('   +0/turn', 'dim')], []];
  for (var i = 0; i < sl.length; i++) {

  rows.push([sg('  compactions ', 'dim'), sg('0', 'fg'), sg('   re-reads ', 'dim'), sg('3', 'warn'), sg('   stale ', 'dim'), sg('8', 'warn'), sg('   velocity ', 'dim'), sg('—', 'dim'), sg(' (turn 1)', 'dim')]);
  return { title: 'context', keys: 'Enter turn ledger', rows: rows };
}
function bCost(cols) {

  var rows = [[sg('  ≈$22.50', 'fg', true), sg('   API-equivalent list price — a subscription is not billed per token', 'warn')], []];
  for (var k = 0; k < r.length; k++) {
    var l = []; at(l, 2); l.push(sg(r[k][0], 'fg')); at(l, 16);
    var f = Math.max(1, Math.round(r[k][2] / 100 * bw));
    l.push(sg('▇'.repeat(f), r[k][3])); l.push(sg('▁'.repeat(bw - f), 'border'));
    at(l, 16 + bw + 2); l.push(sg(r[k][1], 'fg', true));
    rows.push(l);
  }
  rows.push([]);
  rows.push([sg('  cache hit ', 'dim'), sg('99 %', 'ok', true), sg('   TTL ', 'dim'), sg('1h', 'fg'), sg('   misses ', 'dim'), sg('0', 'ok'), sg('   burn ', 'dim'), sg('≈$90/h', 'warn', true), sg('   next 30c ', 'dim'), sg('≈$5.6', 'fg')]);
  rows.push([sg('  last session ', 'dim'), sg('$1.19', 'fg'), sg(' over ', 'dim'), sg('1d 13h', 'fg')]);
  return { title: 'cost', keys: 'a agents · Enter ledger', rows: rows };
}
function bTools(cols) {

            ['Bash·test', '39', '0', '1.6s', '12k', '1:12', 'cargo test harness_facts'],
            ['Bash·implement', '30', '1', '227ms', '9k', '3:40', 'cargo fmt --all && make…'],
            ['Write', '2', '0', '38ms', '—', '8:20', 'src/agent_ledger.rs'],
            ['Read', '1', '0', '52ms', '10k', '12:04', 'src/agents.rs']];
  var h = []; at(h, 2); h.push(sg('TOOL / CLASS', 'dim')); rt(h, 27, 'CALLS', 'dim'); rt(h, 34, 'ERR', 'dim'); rt(h, 44, 'p50', 'dim'); rt(h, 53, '→CTX', 'dim'); rt(h, 62, 'LAST', 'dim');
  if (wide) { at(h, 66); h.push(sg('LAST INPUT', 'dim')); }
  var rows = [h];
  for (var q = 0; q < tr.length; q++) {
    var l = []; at(l, 2); l.push(sg(tr[q][0], 'fg'));
    rt(l, 27, tr[q][1], 'fg', true); rt(l, 34, tr[q][2], tr[q][2] === '0' ? 'dim' : 'warn', tr[q][2] !== '0');
    rt(l, 44, tr[q][3], 'fg'); rt(l, 53, tr[q][4], (tr[q][4] === '10k' || tr[q][4] === '18k') ? 'warn' : 'fg'); rt(l, 62, tr[q][5], 'dim');
    if (wide) { at(l, 66); l.push(sg(tr[q][6], 'dim')); }
    rows.push(l);
  }
  rows.push([]);
  rows.push([sg('  159 calls', 'fg', true), sg('   1 error ', 'dim'), sg('Command Failed', 'warn'), sg('   0 denied   ', 'dim'), sg('▸ running ', 'accent'), sg('Bash cargo fmt --all', 'fg'), sg('  0:03', 'fg', true)]);
  return { title: 'tools', keys: 's sort · / filter', rows: rows };
}
function bFiles(cols) {
  var fr = [['src/agents.rs', 'R×3', '8k', 're-read ×3 — no edit between', 'warn'],
            ['src/tools.rs', 'R×3', '6k', 're-read ×3 — no edit between', 'warn'],
            ['src/agent_ledger.rs', 'W×1', '—', 'IDE edit after Claude wrote it', 'dim'],
            ['src/task_notification.rs', 'W×1', '—', 'IDE edit after Claude wrote it', 'dim'],
            ['docs/metrics.md', 'R×1', '4k', '', 'dim']];
  var h = []; at(h, 2); h.push(sg('FILE', 'dim')); rt(h, 38, 'TOUCH', 'dim'); rt(h, 46, '→CTX', 'dim');
  if (cols >= 100) { at(h, 50); h.push(sg('NOTE', 'dim')); }
  var rows = [h];
  for (var i = 0; i < fr.length; i++) {
    var l = []; at(l, 2); l.push(sg(fr[i][0], 'fg')); rt(l, 38, fr[i][1], 'fg', true); rt(l, 46, fr[i][2], 'fg');
    if (cols >= 100 && fr[i][3]) { at(l, 50); l.push(sg(fr[i][3], fr[i][4])); }
    rows.push(l);
  }
  rows.push([]);
  rows.push([sg('  27 touched', 'fg', true), sg('   8 stale reads', 'warn'), sg('   2 IDE edits', 'dim'), sg('   git +0/−0', 'dim')]);
  return { title: 'files', keys: 's sort', rows: rows };
}
function bEvents(cols) {
  var ev = [['05:53', 'tool', 'Bash', 'cargo fmt --all && make check > /tmp/check.log', 'fg'],
            ['05:52', 'hook', '', 'PostToolBatch', 'dim'],
            ['05:52', 'tool', 'Bash', '✓ 94 tokens to context', 'fg'],
            ['05:52', 'tool', 'Bash', 'cargo test harness_facts 2>&1 | grep -c ok', 'fg'],
            ['05:52', 'hook', '', 'PostToolBatch', 'dim'],
            ['05:51', 'api', '', 'cost-state  ≈$22.50 · 159 calls · retries 0:00', 'warn'],
            ['05:44', 'note', '', '/clear · continued in a new session', 'accent']];
  return { title: 'events', keys: '/ filter', rows: ev.map(function (e) {
    var l = []; at(l, 2); l.push(sg(e[0], 'dim')); at(l, 9); l.push(sg(e[1], 'accent')); at(l, 15); if (e[2]) l.push(sg(e[2], 'fg'));
    at(l, 21); l.push(sg(e[3], e[4])); return l; }) };
}
var BODIES = { context: bContext, cost: bCost, tools: bTools, files: bFiles, events: bEvents };
function frame(cols, b, onBack) {
  var out = [], t = [sg('╭─ ', 'border'), sg(b.title, 'fg', true), sg(' ', 'border')];
  var tail = [sg(' ', 'border'), sg(b.keys, 'dim'), sg('  ', 'border'), sg('Esc back', 'accent', false, onBack), sg(' ─╮', 'border')];
  var n = cols - lw(t) - lw(tail); t.push(sg('─'.repeat(n > 0 ? n : 0), 'border'));
  out.push(t.concat(tail));
  for (var i = 0; i < b.rows.length; i++) {
    var l = fit([sg('│', 'border')].concat(b.rows[i]), cols - 1); at(l, cols - 1); l.push(sg('│', 'border')); out.push(l);
  }
  out.push([sg('╰' + '─'.repeat(Math.max(0, cols - 2)) + '╯', 'border')]);
  return out;
}

// ============ 1 · INSTRUMENT ============
function instrumentScreen(self, cols) {
  var st = self.state, wide = cols >= 100, out = [];
  if (st.view !== 'overview') return frame(cols, BODIES[st.view](cols), function () { self.setState({ view: 'overview' }); });
  var go = function (v) { return function () { self.setState({ view: v }); }; };
  var C = wide ? { l: 1, v: 30, b: 47, c: 64, n: 70 } : { l: 1, v: 22, b: 35, c: 48, n: 52 };
  var row = function (label, view, v, vr, b, br, c, cr, note, nr) {
    var li = []; at(li, C.l); li.push(sg(label, view ? 'accent' : 'dim', false, view ? go(view) : undefined));
    rt(li, C.v, v, vr || 'fg', true);
    if (b) rt(li, C.b, b, br || 'fg');
    if (c) rt(li, C.c, c, cr || 'fg');

    out.push(li);

  };
  out.push(sp([sg(' cctop', 'accent', true)], [sg('opus-5 · turn 1 · 52:11 · ~/code/cctop ', 'dim')], cols));
  out.push(rule(cols));
  var s = []; at(s, 1); s.push(sg('WORKING', 'ok', true));
  rt(s, C.v, '52:11', 'fg', true); rt(s, C.b, '159 calls', 'fg'); rt(s, C.c, '1 err', 'warn');
  if (wide) { at(s, C.n); s.push(sg('▸ ', 'ok')); s.push(sg('steer window', 'fg')); s.push(sg('  ·  1:56 silent', 'dim')); }
  out.push(s); out.push(rule(cols));
  row('context', 'context', '350k', 'fg', 'of 1.00M', 'dim', '35 %', 'fg', '616k to autocompact');
  row('5h limit', null, '4 %', 'fg', 'of 100 %', 'dim', '↻ 4h06', 'dim', '7d 22 %  ·  long ctx 78 %', 'warn');
  row('cache', 'cost', '59m', 'fg', 'of 1h', 'dim', 'warm', 'ok', '0 misses  ·  re-writes 350k cold');
  row('spend', 'cost', '≈$22.50', 'fg', '≈$90/h', 'warn', '≈$29/turn', 'warn', 'API-equivalent, not a bill');
  out.push(rule(cols));
  row('running', 'tools', 'Bash', 'accent', '0:03', 'fg', '', null, 'cargo fmt --all && make check > /tmp/check.log');
  row('tools', 'tools', '159', 'fg', '1 err', 'warn', '', null, 'explore 69 · test 39 · implement 30');
  row('files', 'files', '27', 'fg', '8 stale', 'warn', '', null, 'agents.rs ×3 re-read · 2 IDE edits');
  row('checks', null, '✓', 'ok', 'rework 0', 'ok', '', null, 'cargo test 10s  ·  git +0/−0');
  out.push(rule(cols));
  var e = []; at(e, 1); e.push(sg('05:53', 'dim', false, go('events'))); at(e, 9); e.push(sg('Bash', 'fg')); at(e, 16); e.push(sg('cargo fmt --all && make check > /tmp/check.log', 'dim'));
  out.push(e);
  var e2 = []; at(e2, 1); e2.push(sg('05:52', 'dim', false, go('events'))); at(e2, 9); e2.push(sg('hook', 'fg')); at(e2, 16); e2.push(sg('PostToolBatch', 'dim'));
  out.push(e2); out.push([]);
  out.push([sg(' ?', 'accent', true), sg('help   ', 'dim'), sg('1-9', 'accent', true), sg(' panels   ', 'dim'),
            sg('w', 'accent', true, function () { self.setState({ w: !st.w }); }), sg(st.w ? ' wide ON   ' : ' wide   ', st.w ? 'ok' : 'dim'),
            sg('q', 'accent', true), sg(' quit', 'dim')]);
  return out;
}

// ============ 2 · LEDGER ============
var LROWS = [
  { n: 'context', v: '350k', of: '1.00M', p: 35, note: '616k to autocompact', view: 'context', g: 'budget', stacked: true },
  { n: '5h limit', v: '4 %', of: '100 %', p: 4, note: 'resets 4h06', g: 'budget' },
  { n: '7d limit', v: '22 %', of: '100 %', p: 22, note: 'resets 76h06 · long ctx 78 %', nr: 'warn', g: 'budget' },
  { n: 'cache', v: '59m', of: '1h', p: 98, note: '0 misses · re-writes 350k cold', view: 'cost', g: 'budget' },
  { n: 'spend', v: '≈$22.50', of: '—', p: null, note: '≈$90/h · ≈$29/turn · API-equivalent', view: 'cost', g: 'cost' },
  { n: 'rework', v: '0', of: '—', p: null, note: '✓ cargo test 10s · git +0/−0', nr: 'ok', g: 'work' },
  { n: 'tools', v: '159', of: '—', p: null, note: '1 err · explore 69 · test 39 · impl 30', view: 'tools', g: 'work' },
  { n: 'files', v: '27', of: '—', p: null, note: '8 stale · agents.rs ×3 re-read', nr: 'warn', view: 'files', g: 'work' },
  { n: 'running', v: 'Bash', of: '0:03', p: null, note: 'cargo fmt --all && make check', view: 'tools', g: 'work' }
];
function ledgerScreen(self, cols) {
  var st = self.state, wide = cols >= 100, out = [];
  if (st.view !== 'overview') return frame(cols, BODIES[st.view](cols), function () { self.setState({ view: 'overview' }); });
  var C = wide ? { r: 1, v: 26, l: 40, b: 44, bw: 20, p: 69, n: 73 } : { r: 1, v: 22, l: 33, b: 36, bw: 12, p: 52, n: 56 };
  var rows = LROWS.filter(function (x) { return st.filter === 'all' || x.g === st.filter; });
  var key = st.sort, asc = st.asc;
  rows = rows.slice().sort(function (a, b) {
    var x, y;
    if (key === 'reading') { x = a.n; y = b.n; return asc ? (x < y ? -1 : x > y ? 1 : 0) : (x > y ? -1 : x < y ? 1 : 0); }
    if (key === 'value') { x = a.v; y = b.v; return asc ? (x < y ? -1 : x > y ? 1 : 0) : (x > y ? -1 : x < y ? 1 : 0); }
    x = a.p === null ? -1 : a.p; y = b.p === null ? -1 : b.p;      // blanks last on descending

  });
  var sortBy = function (k) { return function () { self.setState(st.sort === k ? { asc: !st.asc } : { sort: k, asc: k === 'fill' ? false : true }); }; };
  var mark = function (k) { return st.sort === k ? (st.asc ? ' ▲' : ' ▼') : ''; };
  out.push(sp([sg(' cctop', 'accent', true), sg('  opus-5 · turn 1 · 52:11 · ~/code/cctop', 'dim')],
              [sg('● ', 'ok'), sg('WORKING', 'ok', true), sg(' 52:11 · 159c · ', 'dim'), sg('1 err', 'warn')], cols));
  out.push(sp([sg(' Readings', 'fg', true), sg('(' + st.filter + ')', 'dim'), sg('[' + rows.length + ']', 'accent', true)],
              [sg('▸ ', 'ok'), sg('steer window — 4 calls, 1:56 silent', 'fg')], cols));

}

  out.push(t.concat(map));

}
