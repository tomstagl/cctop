[package]
name = "cctop-charts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "cctop's chart renderer: one chart spec drawn as half-block terminal cells or as an antialiased picture"
license = "MIT"
repository = "https://github.com/tomstagl/cctop"

[dependencies]
# No `simd`: the scalar pipeline draws the same pixels on every target
# (x86_64, aarch64, wasm32), which the picture hashes in the tests rely on.
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
insta = "1"
serde_json = "1"
sha2 = "0.10"
