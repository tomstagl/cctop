name: ci
on:
  push:
    branches: [main, "ralph/**"]
  pull_request:
  # Daily: a Claude Code release that moves a `$` surface the pane uses shows
  # up in the `contract` job within a day, naming the surface (issue #4).
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  pane:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  contract:
    # Everything that needs the `claude` CLI, against the latest release:
    # the headless load check of docs/verification/pane.md §A (no model
    # call: `/plugin-types` is the prompt), the contract surface diffed
    # against the checked-in d.ts, `claude plugin validate --strict`, and
    # the version pins (scripts/check-contract.sh). The step summary
    # carries the result line §A records.
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the latest Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - run: ./scripts/check-contract.sh
