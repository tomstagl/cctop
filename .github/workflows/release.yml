name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="cctop-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cctop" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp -r plugin "dist/$name/plugin"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -eu
          (cd dist && cat *.sha256 > SHA256SUMS && ls -la)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    # Set the repository variable HOMEBREW_TAP (e.g. tomstagl/homebrew-tap)
    # and the secret HOMEBREW_TAP_TOKEN (a PAT with contents:write on it).
    if: ${{ vars.HOMEBREW_TAP != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: render formula
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "dist/cctop-${version}-$1.tar.gz.sha256"; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_ARM_MAC@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_X86_MAC@/$(sha x86_64-apple-darwin)/" \
              -e "s/@SHA_X86_LINUX@/$(sha x86_64-unknown-linux-gnu)/" \
              -e "s/@SHA_ARM_LINUX@/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s#@REPO@#${GITHUB_REPOSITORY}#g" \
              packaging/homebrew/cctop.rb > cctop.rb
          cat cctop.rb
      - name: push to tap
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp cctop.rb tap/Formula/cctop.rb
          cd tap
          git config user.name "cctop-release"
          git config user.email "cctop-release@users.noreply.github.com"
          git add Formula/cctop.rb
          git commit -m "cctop ${GITHUB_REF_NAME}" || echo "formula unchanged"
          git push

  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --locked
